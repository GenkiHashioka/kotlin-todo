spring.application.name=kotlin-todo

# DataSource - docker-compose経由のPostgreSQL 17 (kotlin_todo/kotlin_todo/kotlin_todo)
spring.datasource.url=jdbc:postgresql://localhost:5432/kotlin_todo
spring.datasource.username=kotlin_todo
spring.datasource.password=kotlin_todo

# スキーマ管理をFlywayに委ねる。(HibernateはDDLに触らない)
spring.jpa.hibernate.ddl-auto=none

# Flywayはクラスパスに含まれると自動的に有効になるが、明示的に記述することで明確さを保つ。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
